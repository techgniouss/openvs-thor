name: Release Windows build

# Builds the Windows x64 installers - OpenVSSetup-x64-<version>.exe (system-wide, admin)
# and OpenVSUserSetup-x64-<version>.exe (per-user, no admin) - and attaches them to a
# published GitHub Release. Installed builds poll this repository's latest release and
# update themselves from those assets (src/vs/platform/update/common/githubReleases.ts),
# matched by exact file name and by the release tag's version, so:
#   - tag releases as a v-prefixed version (v1.128.0), higher than the last one - the app
#     finds a version's release notes at tag v<version>;
#   - the build is stamped with the tag's version (not package.json's), because that is
#     what an installed build compares the next release against. A build stamped with a
#     stale version would see its own release as newer and reinstall it every hour.
# There is no other CI in this fork — see README.md, "Continuous integration" — the microsoft/vscode Azure Pipelines definitions under
# build/azure-pipelines/ target Microsoft's own self-hosted infra and cannot run here.
# This workflow is independent of those and only builds+packages, no signing/telemetry/CG.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Release tag to upload the built exe to (leave empty to just build and keep it as a workflow artifact)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenVS Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      npm_config_foreground_scripts: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Exclude build workspace from Windows Defender
        # GH-hosted windows-latest runners' real-time AV has been observed quarantining
        # freshly-downloaded unsigned native .node binaries mid-npm-install (this repo
        # pulls several across extensions - node-pty, sqlite3, keytar, etc. - see
        # build/.moduleignore) - npm still exits 0 since the file was written successfully
        # at the time, so this fails silently many steps later instead of here. Exclude the
        # whole runner workspace parent (covers the checkout dir and the sibling
        # VSCode-win32-x64 output dir the packaging step writes next to it).
        shell: pwsh
        run: |
          $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionPath $parent -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction SilentlyContinue
          Write-Host "Excluded $parent from Windows Defender real-time scanning"

      - name: Validate release tag
        # Fail in seconds rather than after an hour of building. Tagless manual runs keep
        # package.json's version.
        id: release
        if: github.event_name == 'release' || inputs.upload_to_release != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_to_release }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not ($env:RELEASE_TAG -match '^v(\d+\.\d+\.\d+)$')) {
            throw "Release tag '$env:RELEASE_TAG' is not a version tag (expected v1.2.3). Installed builds update to, and read release notes from, v-prefixed version tags."
          }
          echo "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          echo "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A manual run that uploads to a release must build that release's tag, not
          # whichever branch the run was started from.
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Locate Visual Studio (for build/npm/preinstall.ts's toolchain check)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere - runner image changed, update this step"
          }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) {
            throw "vswhere found no Visual Studio installation"
          }
          Write-Host "Found Visual Studio at: $vsPath"
          echo "vs2022_install=$vsPath" >> $env:GITHUB_ENV

      - name: Add Windows SDK to PATH (for signtool.exe)
        # build/gulpfile.vscode.ts's patchWin32DependenciesTask shells out to
        # signtool.exe to strip stale Authenticode signatures before rcedit stamps
        # version info onto every .node/rg.exe in the packaged app. signtool ships
        # with the Windows SDK and is NOT on PATH on GH-hosted runners. The gulpfile
        # now treats a missing signtool as "unsigned" rather than failing, so this
        # step is an optimization, not a hard requirement - hence no throw.
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          if ($signtool) {
            $dir = Split-Path $signtool.FullName
            Write-Host "Found signtool at: $($signtool.FullName)"
            echo $dir >> $env:GITHUB_PATH
          } else {
            Write-Host "signtool.exe not found - packaging will skip signature stripping"
          }

      - name: Install dependencies
        run: npm ci

      - name: Stamp release version
        # After `npm ci`, which checks package.json against the lockfile.
        if: steps.release.outputs.version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" $version
          Write-Host "Building as version $version"

      - name: Build client (compile, mangle, minify, package)
        run: npm run gulp vscode-win32-x64-min

      - name: Patch inno updater icon
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build system installer (Inno Setup)
        run: npm run gulp vscode-win32-x64-system-setup

      - name: Build user installer (Inno Setup)
        # The per-user install is the one that updates silently in the background; the
        # system-wide one needs a UAC prompt to apply each update.
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Collect installers
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (node -p "require('./package.json').version")
          New-Item -ItemType Directory -Force -Path out\setup | Out-Null
          # Names must match gitHubAssetName() in updateService.win32.ts exactly.
          $installers = @(
            @{ Src = ".build\win32-x64\system-setup\OpenVSSetup.exe"; Dest = "out\setup\OpenVSSetup-x64-$version.exe" },
            @{ Src = ".build\win32-x64\user-setup\OpenVSSetup.exe"; Dest = "out\setup\OpenVSUserSetup-x64-$version.exe" }
          )
          foreach ($i in $installers) {
            if (-not (Test-Path $i.Src)) {
              throw "Installer not found at $($i.Src) - build did not produce an exe"
            }
            Move-Item -Force $i.Src $i.Dest
            Get-Item $i.Dest | Select-Object Name, Length
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenVSSetup-x64-${{ steps.collect.outputs.version }}
          path: out/setup/*.exe
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || inputs.upload_to_release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.release.outputs.tag }}"
          gh release upload $tag (Get-ChildItem out\setup\*.exe).FullName --clobber
