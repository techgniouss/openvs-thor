<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
	<!-- The chat mark from media/icon.png and media/hero.png, reduced to a silhouette:
	     Mjolnir over a speech bubble with the bot's face punched out of it.

	     The activity bar renders this as a theme-colored mask, so only alpha survives —
	     no gradients, no strokes, one currentColor fill, and every interior detail (the
	     bolt, the eyes, the smile) has to be a hole rather than a lighter shade. The
	     hero's outer lightning ring is deliberately dropped: at the 16px view-header size
	     a 1px arc wrapping the bubble muds into the bubble's own edge.

	     One path, fill-rule="evenodd" — so no two filled subpaths may overlap by any
	     positive area or the overlap inverts into a hole. The handle stops at y=10.4,
	     exactly the bubble's top edge, for that reason. Details stay chunky for the same
	     reason the old hammer's bolt did: they have to survive the 16px downscale. -->
